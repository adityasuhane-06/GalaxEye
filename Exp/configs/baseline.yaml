# ─── Experiment Configuration ─────────────────────────────────────────────────
# GalaxEye EO-SAR Binary Change Detection
# Building-Guided Two-Stage Model
# Target: Kaggle T4x2 (2× NVIDIA T4, 16GB VRAM each)
# ───────────────────────────────────────────────────────────────────────────────

# Random seed for reproducibility
seed: 42

# ─── Data ─────────────────────────────────────────────────────────────────────
data:
  train_dir: "data/train/train"
  val_dir: "data/val/val"
  test_dir: "data/test/test"
  crop_size: 512
  num_workers: 4

  # Normalization — computed from training set EDA
  eo_mean: [0.3217, 0.3462, 0.2881]
  eo_std: [0.2406, 0.2160, 0.2056]
  sar_mean: 0.2053
  sar_std: 0.1626

  # Oversampling positive tiles
  oversample_positive: true
  oversample_weight: 10.0

# ─── Model ────────────────────────────────────────────────────────────────────
model:
  name: "BuildingGuidedChangeDetector"
  pretrained: true   # ImageNet-pretrained ResNet34 backbones
  
# ─── Training ─────────────────────────────────────────────────────────────────
training:
  batch_size: 16           # 8 per GPU × 2 GPUs
  epochs: 80
  early_stopping_patience: 15

  optimizer:
    name: "AdamW"
    lr: 1.0e-4
    weight_decay: 1.0e-4

  scheduler:
    name: "CosineAnnealingLR"
    T_max: 80              # Same as epochs
    eta_min: 1.0e-6

  # Backbone freeze for warmup
  freeze_backbone_epochs: 5

  # Mixed precision (FP16)
  use_amp: true

# ─── Loss ─────────────────────────────────────────────────────────────────────
loss:
  building_pos_weight: 5.0
  damage_pos_weight: 10.0
  lambda_building: 1.0
  lambda_damage: 1.0
  lambda_aux: 0.4
  multiclass_weights: [0.1, 0.5, 10.0, 5.0]   # bg, intact, damaged, destroyed

# ─── Evaluation ───────────────────────────────────────────────────────────────
eval:
  # Threshold sweep for optimal binary threshold
  sweep_thresholds: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8]
  
  # Test-time augmentation
  tta: true                # Horizontal + vertical flip
  
  # Post-processing
  min_component_area: 16   # Remove tiny noise components

# ─── Outputs ──────────────────────────────────────────────────────────────────
output:
  checkpoint_dir: "Exp/checkpoints"
  log_dir: "Exp/logs"
  save_every: 5            # Save checkpoint every N epochs
