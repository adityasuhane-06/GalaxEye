seed: 2026
device: auto

data:
  train_dir: data/train/train
  val_dir: data/val/val
  test_dir: data/test/test
  train_scenes: ["01", "02", "03", "04", "05", "06"]
  val_scenes: ["07", "08"]
  image_size: 512
  multiscale_train_sizes: [384, 512]
  input_channels: 4
  positive_crop_prob: 0.12
  intact_crop_prob: 0.40
  hard_negative_crop_prob: 0.35
  grayscale_prob: 0.35
  sar_speckle_prob: 0.65
  channel_shuffle_prob: 0.05
  brightness_contrast_prob: 0.55
  misregistration_prob: 0.25
  misregistration_max_shift: 2
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

training:
  epochs: 60
  batch_size: 2
  grad_accum_steps: 4
  use_data_parallel: false
  device_ids: [0]
  learning_rate: 0.00003
  weight_decay: 0.04
  optimizer: adamw
  scheduler: cosine
  amp: false
  grad_clip_norm: 1.0
  val_every: 1
  early_stopping_patience: 12
  log_interval: 25
  checkpoint_dir: outputs/checkpoints_cross_event_gated
  resume: null

loss:
  name: multitask_bce_ce_dice
  binary_weight: 0.35
  ce_weight: 0.45
  class_dice_weight: 0.20
  consistency_weight: 0.0
  bce_weight: 0.50
  dice_weight: 0.50
  pos_weight: 1.5
  class_weights: [0.05, 1.20, 2.00, 2.50]
  smooth: 1.0

model:
  name: multitask_gated_difference_unet
  dropout: 0.40
  use_aspp: true
  freeze_batchnorm: encoder

evaluation:
  threshold: 0.4
  binary_source: binary
  val_full_image: true
  tile_size: 512
  tile_stride: 512
  min_component_area: 64
  checkpoint_threshold_sweep: true
  checkpoint_metric: best_threshold_iou
  train_tta: false
  save_visualizations: true
  visualization_count: 12
